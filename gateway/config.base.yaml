# croak-gate LiteLLM settings except model_list, which make_config.py adds from models.yaml.
guardrails:
  - guardrail_name: croak-policy
    litellm_params:
      guardrail: croak_guardrail.CroakGuardrail
      mode: pre_call
      default_on: true

litellm_settings:
  drop_params: true
  request_timeout: 1800
  json_logs: true
  callbacks: ["croak_archive.archive_logger"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  # Message text never goes to LiteLLM's spend logs; the masked archive is
  # written by croak_archive.py according to policy.yaml.
  store_prompts_in_spend_logs: false
