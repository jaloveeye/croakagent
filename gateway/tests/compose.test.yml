# Local end-to-end test: croak-gate in front of a mock upstream.
#   docker compose -f docker-compose.yml -f tests/compose.test.yml --env-file <test.env> -p croak-test up -d
services:
  mock:
    image: python:3.12-alpine
    command: ["python", "/mock/mock_upstream.py"]
    environment:
      RECORDS: /records
    volumes:
      - ./tests/mock_upstream.py:/mock/mock_upstream.py:ro
      - ${CROAK_TEST_RECORDS:?}:/records
  gate:
    depends_on:
      mock:
        condition: service_started
    volumes:
      - ./tests/policy.test.yaml:/app/gateway/policy.yaml:ro
      - ${CROAK_TEST_DATA:?}:/data
  auth:
    volumes:
      - ./tests/policy.test.yaml:/app/policy.yaml:ro
      - ${CROAK_TEST_DATA:?}:/data:ro
