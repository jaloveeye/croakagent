# croak-gate: LiteLLM proxy with the croak policy guardrail.
# Secrets come only from the environment (os.environ/...); see .env.example.
model_list:
  - model_name: default
    litellm_params: &upstream
      model: openai/default
      api_base: os.environ/UPSTREAM_API_BASE
      api_key: os.environ/UPSTREAM_API_KEY
      timeout: 1800
      stream_timeout: 1800
      num_retries: 0
  # The upstream issues a separate key for the qwen deployments.
  - model_name: qwen3.8-27b-nvfp4
    litellm_params:
      <<: *upstream
      model: openai/qwen3.8-27b-nvfp4
      api_key: os.environ/UPSTREAM_API_KEY_QWEN
  - model_name: worker-chat
    litellm_params:
      <<: *upstream
      model: openai/qwen3.8-27b-nvfp4
      api_key: os.environ/UPSTREAM_API_KEY_QWEN
  - model_name: croak
    litellm_params:
      <<: *upstream
      model: openai/croak

guardrails:
  - guardrail_name: croak-policy
    litellm_params:
      guardrail: croak_guardrail.CroakGuardrail
      mode: pre_call
      default_on: true

litellm_settings:
  drop_params: true
  request_timeout: 1800
  json_logs: true
  callbacks: ["croak_archive.archive_logger"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  # Message text never goes to LiteLLM's spend logs; the masked archive is
  # written by croak_archive.py according to policy.yaml.
  store_prompts_in_spend_logs: false
