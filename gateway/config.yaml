# croak-gate: LiteLLM proxy with the croak policy guardrail.
# GENERATED by make_config.py from models.yaml and config.base.yaml; edit those.
# Secrets come only from the environment (os.environ/...); see .env.example.
model_list:
- model_name: default
  litellm_params:
    model: openai/default
    api_base: os.environ/UPSTREAM_API_BASE
    api_key: os.environ/UPSTREAM_API_KEY
    timeout: 1800
    stream_timeout: 1800
    num_retries: 0
- model_name: qwen3.8-27b-nvfp4
  litellm_params:
    model: openai/qwen3.8-27b-nvfp4
    api_base: os.environ/UPSTREAM_API_BASE
    api_key: os.environ/UPSTREAM_API_KEY_QWEN
    timeout: 1800
    stream_timeout: 1800
    num_retries: 0
- model_name: worker-chat
  litellm_params:
    model: openai/qwen3.8-27b-nvfp4
    api_base: os.environ/UPSTREAM_API_BASE
    api_key: os.environ/UPSTREAM_API_KEY_QWEN
    timeout: 1800
    stream_timeout: 1800
    num_retries: 0
- model_name: croak
  litellm_params:
    model: openai/croak
    api_base: os.environ/UPSTREAM_API_BASE
    api_key: os.environ/UPSTREAM_API_KEY
    timeout: 1800
    stream_timeout: 1800
    num_retries: 0
guardrails:
- guardrail_name: croak-policy
  litellm_params:
    guardrail: croak_guardrail.CroakGuardrail
    mode: pre_call
    default_on: true
litellm_settings:
  drop_params: true
  request_timeout: 1800
  json_logs: true
  callbacks:
  - croak_archive.archive_logger
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  store_prompts_in_spend_logs: false
